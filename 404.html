<!DOCTYPE html>
<html lang="pt-BR">

    <link href="assets/css/style-integrativa-ajustado.css" rel="stylesheet" type="text/css">
    <style>
      .iht-404 {

  <body>

      <div>
        <img src="assets/img/logo-integrativa-footer.png" alt="Integrativa Health Tech">

        <a class="iht-btn iht-btn--primary" href="./">Voltar ao início</a>
